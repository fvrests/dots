# true color
set -g default-terminal 'tmux-256color'
set -as terminal-overrides ',*256col*:RGB'

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colors - needs tmux-3.0

# neovim specific settings (listed in `:checkhealth vim`)
set -s escape-time 0
set -g focus-events on

# support super/alt/ctrl keys, used for fish toggle_theme
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g mouse on # clickable UI
set -g base-index 1 # start windows at 1
set -g renumber-windows on # keep in order
set -g detach-on-destroy off
set -g history-limit 10000 # increase prompt history

# tmux statusbar
set -g status-left-length 30
set -g status-right ""
set -g status-style bg=default

# change prefix to ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# prefix+r to reload config
bind r source-file $HOME/.config/tmux/tmux.conf\; display-message "tmux.conf reloaded"
# prefix+x to close/kill processes
bind x kill-pane # skip "kill-pane 1? (y/n)" prompt

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r ^ last-window

# shortcuts
bind f neww -n "^sessions" "tmux-sessions"
bind g neww -n "^git" lazygit
bind G neww -n "^git" lazygit --git-dir=$HOME/.dots.git --work-tree=$HOME
